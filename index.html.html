## Bash scripting
#!/usr/bin/env bash; set -euo pipefail :: Safe script header
name="$1"; echo "Hi $name" :: Arguments and variables
if [ -f f ]; then echo yes; fi :: Test that a file exists
for f in *.log; do gzip "$f"; done :: Loop over files
while read -r l; do echo "$l"; done < f :: Read a file line by line
check() { systemctl is-active --quiet "$1" || echo "$1 down"; } :: Function: service check
trap 'echo failed' ERR :: Run code on error
shellcheck script.sh :: Lint your script
## Python
python3 -m venv .venv && source .venv/bin/activate :: Isolated environment
pip install requests pyyaml :: Install libraries
python3 -c "import json,sys;print(json.load(sys.stdin))" < f.json :: Parse JSON from a pipe
requests.get(url, timeout=5).status_code :: Health-check an endpoint
subprocess.run(["df","-h"],capture_output=True,text=True) :: Run a command, capture output

try: ... except Exception as e: :: Handle errors without crashing

## Jenkinsfile
pipeline { agent any; stages { } } :: Declarative skeleton
stage('Build') { steps { sh 'make build' } } :: A stage with a shell step
environment { IMG = "app:$BUILD_NUMBER" } :: Environment variables
withCredentials([string(credentialsId:'tok',variable:'T')]) { sh 'use $T' } :: Inject a secret
post { failure { echo 'failed' } always { cleanWs() } } :: Notify and clean up
when { branch 'main' } :: Deploy only from main
parallel { stage('A'){ } stage('B'){ } } :: Run stages together
input message: 'Deploy to prod?' :: Manual approval gate

kubectl cluster-info; kubectl get nodes -o wide :: Cluster health

## Troubleshooting
kubectl get pods -A -o wide :: Everything, with nodes
kubectl describe pod P :: Events show why it fails

Lab: CrashLoopBackOff :: Bad command in a pod, find it with logs --previous
Lab: ImagePullBackOff :: Typo the tag, fix from describe
Lab: Pending pod :: Request 100 CPUs, read the scheduler event
Lab: zero-downtime update :: Rolling update with a readiness probe
`);
LABS.helm=MK("Helm","Package and release Kubernetes apps.","Install: <code>curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash</code>",`
## Using charts
helm repo add bitnami https://charts.bitnami.com/bitnami :: Add a repo
helm repo update; helm search repo nginx :: Find charts
helm show values bitnami/nginx > values.yaml :: See the options
helm install web bitnami/nginx -n dev --create-namespace :: Install a release
helm install web bitnami/nginx -f values.yaml --set replicaCount=3 :: Override values
helm list -A; helm status web -n dev :: Releases
helm upgrade web bitnami/nginx -n dev --set replicaCount=2 :: Upgrade
helm history web -n dev; helm rollback web 1 -n dev :: Revisions and rollback
helm uninstall web -n dev :: Remove
## Building charts
helm create mychart :: Scaffold
helm template mychart :: Render YAML locally
helm lint mychart :: Check for errors
helm install t ./mychart --dry-run --debug :: Test without applying
helm package mychart :: Build the .tgz
helm dependency update :: Pull sub-charts
## Labs
Lab: chart your own app :: Deployment and Service with image and replicas as values
Lab: environments :: values-dev.yaml and values-prod.yaml with different replicas
Lab: break an upgrade :: Use a bad image, then roll back
`);
LABS.terraform=MK("Terraform","Define infrastructure as code. Always destroy after a lab to avoid charges.","Install Terraform from HashiCorp's apt repo and run <code>aws configure</code>.",`
## Core workflow
terraform version :: Check the install
terraform init :: Download providers, set up the backend
terraform fmt -recursive :: Format
terraform validate :: Syntax check
terraform plan -out=tf.plan :: Preview changes
terraform apply tf.plan :: Apply exactly that plan
terraform output :: Show outputs
terraform destroy :: Tear down
## HCL building blocks
provider "aws" { region = "us-east-1" } :: Provider
resource "aws_s3_bucket" "b" { bucket = "unique-name" } :: Resource
variable "env" { default = "dev" } :: Input variable
output "id" { value = aws_s3_bucket.b.id } :: Output
data "aws_ami" "u" { most_recent = true } :: Read existing data
module "vpc" { source = "./modules/vpc" } :: Reusable module
for_each = toset(["a","b"]) :: Create many from one block
## State
terraform state list; terraform state show ADDR :: Inspect state
terraform import aws_s3_bucket.b NAME :: Adopt an existing resource
terraform state rm ADDR :: Forget without deleting
terraform workspace new staging :: Separate state per environment
backend "s3" { bucket = "x" key = "tf.state" } :: Remote state; add a lock table
terraform plan -refresh-only :: Detect drift
## Labs
Lab: S3 bucket :: Create, tag, destroy
Lab: VPC module :: Public and private subnets, reused for dev and prod
Lab: EC2 web server :: user_data installs nginx, security group allows 80
Lab: remote state + lock :: Move state to S3
`);
LABS.aws=MK("AWS","Work with the CLI so you understand what the console hides.","Open an account, enable MFA on root, make an IAM admin user, <b>set a budget alert first</b>, then <code>aws configure</code>.",`
## Identity + CLI
aws sts get-caller-identity :: Who am I
aws configure --profile lab :: Named profile
aws iam create-user --user-name dev :: Create a user
aws iam attach-user-policy --user-name dev --policy-arn arn:aws:iam::aws:policy/ReadOnlyAccess :: Least privilege
aws iam list-roles --query 'Roles[].RoleName' :: List roles
## VPC networking
aws ec2 create-vpc --cidr-block 10.0.0.0/16 :: VPC
aws ec2 create-subnet --vpc-id V --cidr-block 10.0.1.0/24 :: Subnet
aws ec2 create-internet-gateway :: Then attach it with attach-internet-gateway
aws ec2 create-route --route-table-id R --destination-cidr-block 0.0.0.0/0 --gateway-id I :: Default route
aws ec2 create-security-group --group-name web --description web --vpc-id V :: Firewall
aws ec2 authorize-security-group-ingress --group-id S --protocol tcp --port 443 --cidr 0.0.0.0/0 :: Open HTTPS
## Compute + storage
aws ec2 run-instances --image-id AMI --instance-type t3.micro --key-name K --subnet-id S :: Launch
aws ec2 describe-instances --query 'Reservations[].Instances[].[InstanceId,State.Name]' --output table :: List
aws ec2 terminate-instances --instance-ids I :: Delete
aws s3 mb s3://my-unique-bucket :: Create a bucket
aws s3 sync dir s3://my-unique-bucket --delete :: Sync a folder
aws s3 ls s3://my-unique-bucket --recursive :: List objects
aws ecr create-repository --repository-name app :: Image registry
## Data, serverless, ops
aws rds describe-db-instances :: Managed databases
aws lambda invoke --function-name f out.json :: Run a function
aws logs tail /aws/lambda/f --follow :: Stream logs
aws budgets describe-budgets --account-id A :: Check cost alerts
aws eks update-kubeconfig --name C :: Connect kubectl to EKS
## Labs
Lab: VPC by hand :: Public and private subnet, IGW, NAT, route tables
Lab: web server on EC2 :: Install nginx, limit the security group to your IP
Lab: static site on S3 :: Host a page from a bucket
Lab: break it :: Delete a route, find it with Reachability Analyzer, fix
Lab: rebuild with Terraform :: Same stack from code
`);
LABS.monitoring=MK("Monitoring","See what your systems are doing before users tell you.","Easiest: Docker Compose with Prometheus, Grafana and node_exporter, or kube-prometheus-stack via Helm on kind.",`
## Prometheus
helm install mon prometheus-community/kube-prometheus-stack -n mon --create-namespace :: Full stack on Kubernetes
promtool check config prometheus.yml :: Validate config
curl localhost:9090/api/v1/targets :: Scrape targets
curl localhost:9100/metrics | head :: Raw node_exporter metrics
## PromQL
up :: Which targets are alive
100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))*100 :: CPU percent used
node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes :: Memory available ratio
rate(http_requests_total[5m]) :: Requests per second
histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) :: p95 latency
predict_linear(node_filesystem_avail_bytes[6h], 24*3600) < 0 :: Disk full within 24h
## Alerts, Grafana, logs
amtool check-config alertmanager.yml :: Validate alert routing
Grafana > Connections > Data sources > Prometheus :: Connect the data
Grafana > Dashboards > Import > 1860 :: Node Exporter Full dashboard
helm install loki grafana/loki-stack :: Loki and Promtail for logs
{app="web"} |= "error" :: LogQL: error lines for one app
## Labs
Lab: monitor a VM :: node_exporter, Prometheus, Grafana dashboard
Lab: alert on 80% disk :: Fill the disk with fallocate and watch it fire
Lab: define an SLO :: 99.5% availability, alert on error-budget burn
`);

LABS.ps=MK("Windows/PowerShell","PowerShell works with objects, not text, so pipelines are powerful. Use a Windows Server VM or your own PC.","Use Windows PowerShell 5.1 or install PowerShell 7 (<code>pwsh</code>).",`
## Basics
Get-Help Get-Process -Examples :: Built-in docs with examples
Get-Command *service* :: Find commands by name
Get-Process | Sort CPU -Desc | Select -First 5 :: Top CPU users, passing objects down the pipe
Get-Service | Where Status -eq Running :: Filter running services
Restart-Service Spooler :: Restart a service
Get-WinEvent -FilterHashtable @{LogName='System';Level=2} :: Error events from the System log
## Files, users, network
Get-ChildItem C:/Logs -Recurse -Filter *.log :: Find files
Get-Content app.log -Tail 20 -Wait :: Follow a log like tail -f
Get-LocalUser; New-LocalUser dev :: List and create users
Test-NetConnection host -Port 443 :: Port check, like nc
Get-NetIPAddress; Resolve-DnsName example.com :: IPs and DNS
Get-Disk; Get-Volume :: Disks and free space
## Remote + scripting
Enter-PSSession -ComputerName srv1 :: Interactive remote shell
Invoke-Command -ComputerName srv1 -ScriptBlock { Get-Service } :: Run a command remotely
Get-Process | ConvertTo-Json :: Objects to JSON
foreach ($s in Get-Service) { $s.Name } :: Loop over objects
Lab: health report :: Export CPU, disk and stopped services to CSV
Lab: remote restart :: Restart a stopped service on a second VM
`);
LABS.actions=MK("GitHub Actions","CI/CD inside GitHub. Workflows live in .github/workflows/ci.yml.","Create a repo, push a workflow file, and watch the Actions tab.",`
## Workflow basics
on: [push, pull_request] :: Triggers
runs-on: ubuntu-latest :: Runner OS
uses: actions/checkout@v4 :: Fetch your code
uses: actions/setup-node@v4 :: Install a language runtime
run: npm ci && npm test :: Run shell commands
needs: build :: Order jobs
strategy: matrix: node: [18, 20] :: Test several versions at once
## Secrets, artifacts, deploys
Settings > Secrets and variables > Actions :: Store secrets, read them via the secrets context
uses: actions/upload-artifact@v4 :: Keep build output
uses: actions/cache@v4 :: Speed up with caching
uses: docker/build-push-action@v6 :: Build and push images
environment: production :: Add approvals and environment secrets
## Operate
gh workflow run ci.yml :: Trigger manually
gh run list; gh run watch :: Follow runs
gh run view --log-failed :: Why it failed
Lab: CI :: Lint, test and build on every PR
Lab: Docker to ECR :: Build and push on main
Lab: matrix + cache :: Faster, multi-version tests
Lab: protected deploy :: Production needs approval
`);
LABS.devsecops=MK("DevSecOps","Put security checks in the pipeline. Scan only code and systems you own.","Install Trivy and gitleaks; <code>pip install semgrep checkov</code>",`
## Scanning
trivy image nginx:latest :: Find CVEs in an image
trivy image --severity HIGH,CRITICAL --exit-code 1 app:1.0 :: Fail the pipeline on serious CVEs
trivy fs . :: Scan project dependencies
trivy config . :: Scan Dockerfiles, Terraform and Kubernetes YAML
npm audit; pip-audit :: Language dependency audits
gitleaks detect -v :: Find committed secrets
gitleaks protect --staged :: Block secrets before commit
semgrep --config auto . :: SAST: insecure code patterns
checkov -d . :: Policy checks for infrastructure code
## Hardening
docker run --read-only --user 1000 --cap-drop ALL app :: Least-privilege container
USER appuser :: Dockerfile line so the app never runs as root
securityContext: runAsNonRoot: true :: Same idea in Kubernetes
kubectl get networkpolicy -A :: Is pod traffic restricted
cosign sign IMAGE :: Sign images for supply-chain trust
Lab: pipeline gate :: Fail the build on HIGH CVEs and leaked secrets
Lab: slim an image :: Swap the base image and count the CVEs dropped
Lab: lock down a pod :: Non-root, read-only, no privilege escalation
`);
LABS.gitops=MK("GitOps + Argo CD","Git holds the desired state; Argo CD makes the cluster match it.","Start a kind cluster, then <code>kubectl create ns argocd</code>",`
## Install + access
kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml :: Install Argo CD
kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d :: Admin password
kubectl port-forward svc/argocd-server -n argocd 8080:443 :: Open the UI
argocd login localhost:8080 :: CLI login
## Applications
argocd app create web --repo URL --path k8s --dest-server https://kubernetes.default.svc --dest-namespace dev :: Track a Git path
argocd app list; argocd app get web :: Is it Synced and Healthy
argocd app sync web :: Apply Git state to the cluster
argocd app set web --sync-policy automated --self-heal :: Auto-deploy and undo manual drift
argocd app diff web :: Git versus live differences
argocd app rollback web :: Return to a previous revision
kubectl get applications -n argocd :: Apps are Kubernetes objects too
Lab: deploy by PR :: Change replicas in Git, watch Argo apply it
Lab: drift :: Scale manually and watch self-heal revert it
Lab: app of apps :: One Argo app that deploys others
Lab: CI + GitOps :: Pipeline commits the new image tag to Git
`);
LABS.ai=MK("AI Infra + MLOps","Advanced layer. Practise on CPU with small models; use cloud GPUs briefly and shut them down.","Optional: <code>curl -fsSL https://ollama.com/install.sh | sh</code>",`

<h2>Why you need this</h2>
<p>Most learners collect courses and never reach job-ready. Employers hire people who can fix a broken server, ship through a pipeline and explain what they built. This path is ordered so each skill rests on the one before it, and every stage ends with something you built, broke and repaired.</p>
<div class="grid">
<div class="box"><h3>Ordered</h3>Linux before containers, networking before cloud, containers before Kubernetes.</div>
<div class="box"><h3>Practical</h3>Every lab page is commands you run on Ubuntu, with progress you can tick off.</div>
<div class="box"><h3>Realistic</h3>18–20 months at steady part-time effort, with a portfolio project per stage.</div></div>
<h2>Your progress</h2>
${Object.keys(LABS).map(k=>`<p><a href="#${k}">${LABS[k].t}</a> · ${done(k)}/${total(k)}${bar(pct(k))}</p>`).join("")}
<h2>About the author</h2>
<div class="box"><h3>${ME.name}</h3><p>DevOps engineer in the making, building this guide while learning the path myself, so every step is one I have walked.</p>
<div class="row"><a class="btn g" href="${ME.li}" target="_blank" rel="noopener">LinkedIn</a><a class="btn g" href="${ME.x}" target="_blank" rel="noopener">X</a>${c}</div></div>`},

roadmap(){return `<h1>The roadmap</h1><p class="lead">Ten stages across about 20 months. Inside every stage use one loop: learn, practice, build, break, troubleshoot, automate.</p>
<p>Tap a stage on the map.</p>${mapSvg()}<div class="box" id="det"></div><h2>Full stage list</h2><div class="tl">${PH.map((p,i)=>`<div class="ph"><small>${p[1]}</small><h3>${i+1}. ${p[0]}</h3><p>${p[2]}</p><p><b>Done when:</b> ${p[3]}<br><b>Build:</b> ${p[4]}</p></div>`).join("")}</div>
<h2>What is changing in DevOps</h2>
<div class="grid">
<div class="box"><h3>AI writes the first draft</h3>Assistants generate Terraform, pipelines and runbooks. You are paid to review, test and own the result, so fundamentals matter more, not less.</div>
<div class="box"><h3>AIOps</h3>Anomaly detection, alert correlation and root-cause hints cut noise on call. Learn good metrics and logs first; AI is only as good as your signals.</div>
<div class="box"><h3>GPU and model platforms</h3>Companies now need engineers who run GPU clusters and serve models (Kubernetes, vLLM). It builds directly on Docker and Kubernetes.</div>
<div class="box"><h3>Platform engineering</h3>Teams build internal self-service platforms. Terraform, GitOps and Kubernetes are the core skills.</div></div>
<h2>Also add</h2>
<ul><li><b>Portfolio:</b> one public GitHub repo per stage, each with a README and diagram.</li>
<li><b>Certifications:</b> AWS Solutions Architect Associate around month 9; CKA near month 15.</li>
<li><b>Interviews:</b> from month 14, practise explaining outages, trade-offs and your projects aloud.</li>
<li><b>Writing:</b> post what you learn on LinkedIn weekly; it becomes proof of work.</li></ul>
<h2>Next steps after you start</h2><p>Planned lab pages: Kubernetes and AWS, built in the same format as the pages here.</p>`},

lab(k){const L=LABS[k];return `<h1>${L.t} lab</h1><p class="lead">${L.d}</p><div class="box">${L.setup}</div>
<p><b id="pc">${done(k)}/${total(k)}</b> complete${bar(pct(k))}</p>
${L.g.map((g,gi)=>`<h2>${g[0]}</h2>${g[1].map((c,i)=>{const id=`${k}:${gi}.${i}`;return `<label class="item${P[id]?" d":""}"><input type="checkbox" data-k="${id}" ${P[id]?"checked":""}><div><code class="cmd" data-c="${esc(c[0])}" title="Click to copy">${esc(c[0])}</code><span>${esc(c[1])}</span></div></label>`}).join("")}`).join("")}
<div class="row"><button class="btn g" data-reset="${k}">Reset this lab</button></div>`}};

$app.innerHTML=r in LABS?PAGES.lab(r):(PAGES[r]||PAGES.home)();
const tabs=[["home","Home"],["roadmap","Roadmap"],...Object.keys(LABS).map(k=>[k,LABS[k].t+" "+pct(k)+"%"])];
nav.innerHTML="<b>DevOps Zero→Job</b>"+tabs.map(t=>`<a href="#${t[0]}" class="${t[0]==r?"on":""}">${t[1]}</a>`).join("");
scrollTo(0,0);if(document.getElementById('det'))sel(0)}

document.querySelector(".bar i").style.width=pct(lab)+"%";nav.querySelector(".on").textContent=LABS[lab].t+" "+pct(lab)+"%"});
